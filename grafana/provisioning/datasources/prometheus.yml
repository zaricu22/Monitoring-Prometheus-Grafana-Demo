# Provisioned on startup - no clicking in the UI, the stack is reproducible from git.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus           # fixed uid, referenced by the dashboard JSON files
    type: prometheus
    access: proxy             # Grafana server queries Prometheus (not the browser)
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s        # = scrape interval; used by $__rate_interval
      prometheusType: Prometheus

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
