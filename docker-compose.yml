name: monitoring-demo

# Start the whole stack:  docker compose up -d --build
# Stop it (keep data):    docker compose down
# Starting one service also starts the services it depends_on.

services:
  # ---------- the monitored system ----------

  # Purpose: PostgreSQL database of the order API (real DB, so HikariCP pool metrics are meaningful).
  # Start:   docker compose up -d postgres
  # Login:   demo / demo, database "orders"
  # URL:     localhost:5432  (JDBC: jdbc:postgresql://localhost:5432/orders)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Purpose: Spring Boot order API instrumented with Micrometer; exposes the metrics Prometheus scrapes.
  # Start:   docker compose up -d --build app   (also starts postgres)
  # Login:   none
  # URL:     http://localhost:8080/api/orders           REST API
  #          http://localhost:8080/actuator/health      health check
  #          http://localhost:8080/actuator/prometheus  raw metrics, exactly as Prometheus sees them
  app:
    build: ./app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: demo
      DB_PASSWORD: demo
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- the monitoring stack ----------

  # Purpose: scrapes the app metrics every 5 s, stores the time series, evaluates recording and alerting rules.
  # Start:   docker compose up -d prometheus   (also starts app and postgres)
  # Login:   none
  # URL:     http://localhost:9090  (Query, Targets, Alerts, Rules)
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # allows POST /-/reload after editing config
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  # Purpose: receives firing alerts from Prometheus, groups, routes and inhibits them, sends notifications.
  # Start:   docker compose up -d alertmanager
  # Login:   none
  # URL:     http://localhost:9093  (active alerts, silences)
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  # Purpose: Separate client of Alertmanager's notifications(alerts), only logs them (in real life clients are: Slack, email, etc.).
  # Start:   docker compose up -d alert-receiver
  # Login:   none
  # URL:     no UI; watch notifications with: docker compose logs -f alert-receiver
  #          (http://localhost:8085 only echoes back the request you send)
  alert-receiver:
    image: mendhak/http-https-echo:latest
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /health
    ports:
      - "8085:8080"

  # Purpose: Metrics dashboards: RED & Business, JVM & Database (USE).
  #          read data from Prometheus (all Spring Boot + Micrometer metrics + custom record metrics + alerts).
  # Start:   docker compose up -d grafana   (also starts prometheus, app and postgres)
  # Login:   admin / admin  (skip the password change prompt)
  # URL:     http://localhost:3000  -> Dashboards -> Monitoring Demo
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------- load generator (run on demand) ----------

  # Purpose: generates realistic traffic against the app (profiles: load, spike, smoke), whitout it Grafana do not have data to show.
  # Start:   not started by "up" (profile "load"); run one test, the container is removed afterwards:
  #            docker compose run --rm k6 run /scripts/load.js
  #            docker compose run --rm k6 run -e PROFILE=spike /scripts/load.js
  #          Git Bash: prefix with MSYS_NO_PATHCONV=1
  # Login:   none
  # URL:     none; calls the app inside the Compose network at http://app:8080
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - app

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
