name: monitoring-demo

services:
  # ---------- the monitored system ----------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: demo
      DB_PASSWORD: demo
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- the monitoring stack ----------
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # allows POST /-/reload after editing config
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  # Stand-in for Slack/PagerDuty/e-mail: logs every webhook Alertmanager sends.
  # Watch it with: docker compose logs -f alert-receiver
  alert-receiver:
    image: mendhak/http-https-echo:latest
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /health
    ports:
      - "8085:8080"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------- load generator (run on demand) ----------
  # docker compose run --rm k6 run /scripts/load.js
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - app

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
