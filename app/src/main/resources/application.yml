spring:
  application:
    name: monitoring-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo}
    hikari:
      # Deliberately small so the "slow DB" chaos scenario can exhaust the pool.
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  tomcat:
    # Registers Tomcat MBeans so Micrometer can export tomcat_threads_* metrics.
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is the endpoint Prometheus scrapes.
        # health - Health status (UP/DOWN, db, diskSpace, ping, livenessState, readinessState, ssl)
        # info - Application info (version, build, git, java, os; empty here until configured)
        # metrics - Metrics (HTTP, JVM, CPU, Tomcat, HikariCP, JDBC, Logback, executor, custom orders/payment/chaos)
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # Everyone (every caller) can see everything (DB, disk space, ping, liveness/readiness)
      show-details: always
  metrics:
    # Common tag added to EVERY metric (time series) - lets one dashboard filter many applications.
    tags:
      application: ${spring.application.name}   # label application="monitoring-demo" on every metric
    distribution:
      # Publish histogram buckets for HTTP latency so PromQL can compute any percentile.
      percentiles-histogram:
        http.server.requests: true
      # Extra buckets aligned with SLO thresholds (exact "% of requests faster than 300 ms").
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s
      # Narrow the bucket range to keep the number of time series down.
      minimum-expected-value:
        http.server.requests: 5ms
        payment.process: 10ms   # the @Timed metric - annotations can't set this
      maximum-expected-value:
        http.server.requests: 10s
        payment.process: 1s
  observations:
    annotations:
      # Enables the aspects behind @Timed / @Counted / @Observed.
      enabled: true
